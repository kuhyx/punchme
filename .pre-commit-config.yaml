# Pre-commit configuration for punchme.
#
# Install:  scripts/install_hooks.sh
# Run:      pre-commit run --all-files
#
# Only NON-MUTATING checks belong here. A hook that rewrites a tracked file
# (the patch-version bump) runs from the wrapper hook installed by
# scripts/install_hooks.sh instead -- rewriting pubspec.yaml inside
# pre-commit's stash window makes its `git apply` conflict and silently drops
# the developer's uncommitted edits.

default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      # Both gates are thin delegates to ~/src/utils, which owns the rules so that
      # one repo's idea of "too long" or "badly named" cannot drift.
      - id: file-length
        name: file length <= 250 lines
        entry: scripts/check_file_length.sh
        language: system

      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      # Every dependency on its ecosystem's newest STABLE release, exact-pinned
      # so the question is mechanically answerable at all.
      #
      # `files:` is what keeps this cheap: a commit touching only Dart makes
      # ZERO network requests, and a manifest commit mostly hits a 6h cache.
      #
      # Deliberately WITHOUT --strict. Offline the gate degrades to its cached
      # answer and passes with a loud banner; `--no-verify` is banned, so a
      # hook that hard-failed on a flaky connection would leave no way to
      # commit. CI, always online, runs --strict and is the real authority.
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pubspec\.(yaml|lock)|pyproject\.toml|requirements.*\.txt|uv\.lock
          |package\.json|package-lock\.json|pnpm-lock\.yaml
          |Cargo\.(toml|lock)|go\.(mod|sum)
          |\.fvmrc|\.nvmrc|\.python-version)$

      # Minutes-long, so pre-push; split into <60 s steps, run in this order.
      - id: ci-mirror-setup
        name: CI mirror 1 (clean, pub get)
        entry: bash scripts/ci_mirror.sh setup
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-analyze
        name: CI mirror 2 (analyze)
        entry: bash scripts/ci_mirror.sh analyze
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-format
        name: CI mirror 3 (format)
        entry: bash scripts/ci_mirror.sh format
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-cov-1
        name: CI mirror 4 (tests, shard 1/4)
        entry: bash scripts/ci_mirror.sh coverage --shard 0/4
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-cov-2
        name: CI mirror 5 (tests, shard 2/4)
        entry: bash scripts/ci_mirror.sh coverage --shard 1/4
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-cov-3
        name: CI mirror 6 (tests, shard 3/4)
        entry: bash scripts/ci_mirror.sh coverage --shard 2/4
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-cov-4
        name: CI mirror 7 (tests, shard 4/4)
        entry: bash scripts/ci_mirror.sh coverage --shard 3/4
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      # Same 100% bar and every-lib-file guard, on the union of the 4 shards.
      - id: ci-mirror-cov-merge
        name: CI mirror 8 (coverage 100%, union of shards)
        entry: bash scripts/ci_mirror.sh coverage-merge
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-build
        name: CI mirror 9 (release apk)
        entry: bash scripts/ci_mirror.sh build
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

  - repo: local
    hooks:
      # The only pre-push hook. Everything that used to run here is now
      # `stages: [manual]` -- run on demand with `scripts/check_gate_stamp.sh
      # full`, and by CI on every push. finish_auto.sh stamps HEAD after its
      # gate; a tree without that receipt cannot leave the machine.
      - id: gate-stamp
        name: pushed tree passed the local gate (stamp check)
        entry: scripts/check_gate_stamp.sh check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$|(^|/)(AndroidManifest\.xml|build\.gradle(\.kts)?|strings\.xml|pubspec\.yaml|repo-contract\.toml|[^/]+\.desktop|assets/icon/[^/]+\.png)$
