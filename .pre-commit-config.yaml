# Pre-commit configuration for punchme.
#
# Install:  scripts/install_hooks.sh
# Run:      pre-commit run --all-files
#
# Only NON-MUTATING checks belong here. A hook that rewrites a tracked file
# (the patch-version bump) runs from the wrapper hook installed by
# scripts/install_hooks.sh instead -- rewriting pubspec.yaml inside
# pre-commit's stash window makes its `git apply` conflict and silently drops
# the developer's uncommitted edits.

default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      # Both gates are thin delegates to ~/utils, which owns the rules so that
      # one repo's idea of "too long" or "badly named" cannot drift.
      - id: file-length
        name: file length <= 250 lines
        entry: scripts/check_file_length.sh
        language: system

      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      # Minutes-long, so pre-push rather than pre-commit.
      - id: ci-mirror
        name: CI mirror (clean, analyze, format, coverage, apk)
        entry: bash scripts/ci_mirror.sh
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
